name: AiFavoApk 10 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AiFavoApk10/**'
      - '.github/workflows/aifavo-android.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AiFavoApk10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (automatically signed for testing)
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiFavoApk10-UltraPlus-Gold-debug
          path: AiFavoApk10/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
